<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Attendance System</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --ink: #0e2918;            /* Deep forest green for main text */
    --muted: #3b6b4e;          /* Medium moss green for subtitles/labels */
    --line: #c2dec9;           /* Soft sage border line */
    --bg: #eef7f0;             /* Pale mint background */
    --card: #ffffff;           /* Card background */
    --accent: #198754;         /* Primary emerald green */
    --accent-hover: #146c43;   /* Darker emerald for button hover/active */
    --ok: #137a45;             /* Success green */
    --okbg: #d8f3e5;           /* Light green badge background */
    --bad: #2e6644;            /* Dark eucalyptus green for errors/alerts */
    --badbg: #e2f0e7;          /* Soft green badge background for errors */
    --wait: #38761d;           /* Olive green for waiting state */
    --waitbg: #e9f5e1;         /* Very light sage for waiting state */
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; min-height: 100vh; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px; line-height: 1.5; display: flex; justify-content: center; align-items: flex-start;
  }
  .card { 
    width: 100%; max-width: 430px; background: var(--card); border: 1px solid var(--line); 
    border-radius: var(--radius); padding: 22px; margin: auto; box-shadow: 0 4px 14px rgba(25, 135, 84, 0.08);
  }
  h1 { font-size: 20px; margin: 0 0 4px; color: var(--ink); }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 18px; }
  label { display: block; font-size: 14px; font-weight: 600; margin: 14px 0 5px; color: var(--ink); }
  .hint { font-weight: 400; color: var(--muted); }
  input, select { 
    width: 100%; padding: 11px 12px; font-size: 16px; color: var(--ink); background: #fff; 
    border: 1px solid var(--line); border-radius: 8px; 
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  button { 
    width: 100%; margin-top: 20px; padding: 13px; font-size: 16px; font-weight: 600; 
    color: #fff; background: var(--accent); border: 0; border-radius: 8px; cursor: pointer; 
    transition: background 0.15s ease;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { background: #9bbfa6; cursor: not-allowed; }
  button.link { 
    background: none; color: var(--accent); border: 1px solid var(--line); margin-top: 10px; 
  }
  button.link:hover { background: #eef7f0; }
  .pill { display: flex; gap: 9px; align-items: center; font-size: 14px; padding: 10px 12px; border-radius: 8px; margin-top: 16px; }
  .pill.ok { background: var(--okbg); color: var(--ok); }
  .pill.bad { background: var(--badbg); color: var(--bad); }
  .pill.wait { background: var(--waitbg); color: var(--wait); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
  .pill.wait .dot { animation: blink 1.1s infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  .msg { font-size: 14px; margin-top: 16px; text-align: center; min-height: 20px; font-weight: 500; }
  #qrbox { display: none; margin-top: 20px; text-align: center; }
  #qrcode { display: flex; justify-content: center; padding: 14px 0; }
  .window { font-size: 14px; color: var(--muted); background: #f2faf4; border: 1px solid var(--line); border-radius: 8px; padding: 10px; text-align: left; }
  .urlbox { font-size: 12px; color: var(--muted); word-break: break-all; margin-top: 10px; }
</style>
</head>
<body>

<div class="card">
  <!-- TEACHER VIEW -->
  <div id="teacherView" hidden>
    <h1>Create Attendance QR</h1>
    <p class="sub">Set up session for your sheet.</p>

    <label for="sheetInput">Google Sheet Link</label>
    <input type="text" id="sheetInput" placeholder="Paste Google Sheet URL" autocomplete="off">

    <label for="startTime">Opens <span class="hint">(optional)</span></label>
    <input type="datetime-local" id="startTime">

    <label for="endTime">Closes <span class="hint">(optional)</span></label>
    <input type="datetime-local" id="endTime">

    <button id="genBtn">Create QR Code</button>

    <div id="qrbox">
      <div id="qrcode"></div>
      <div class="window" id="windowInfo"></div>
      <div class="urlbox" id="studentLink"></div>
      <button class="link" id="copyBtn">Copy Student Link</button>
    </div>
  </div>

  <!-- STUDENT VIEW -->
  <div id="studentView" hidden>
    <h1>Record Attendance</h1>
    <p class="sub" id="sessionSub">Checking session availability…</p>

    <form id="form" novalidate>
      <label for="studentId">Student ID</label>
      <input type="text" id="studentId" inputmode="numeric" required autocomplete="off">

      <label for="name">Full Name (Arabic)</label>
      <input type="text" id="name" dir="rtl" minlength="3" required>

      <label for="groupSelect">Group</label>
      <select id="groupSelect" required>
        <option value="" disabled selected>Select group</option>
        <optgroup label="A"><option>A1</option><option>A2</option><option>A3</option><option>A4</option><option>A5</option><option>A6</option></optgroup>
        <optgroup label="B"><option>B1</option><option>B2</option><option>B3</option><option>B4</option><option>B5</option><option>B6</option></optgroup>
        <optgroup label="C"><option>C1</option><option>C2</option><option>C3</option><option>C4</option><option>C5</option><option>C6</option></optgroup>
      </select>

      <div class="pill wait" id="locPill">
        <span class="dot"></span><span id="locText">Detecting GPS location…</span>
      </div>
      <button class="link" id="retryLoc" type="button" hidden>Retry Location</button>

      <button type="submit" id="submitBtn" disabled>Submit Attendance</button>
    </form>

    <p class="msg" id="msg"></p>
  </div>
</div>

<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyjgghPgl_Vwi7E-8yKM3Vc1zYHCfAx9YE2NwJmVK9mAL_0WvA5X10tjfAonaND2EO1/exec";

const params  = new URLSearchParams(location.search);
const sheetId = params.get("sheetId");
const $ = id => document.getElementById(id);

if (sheetId) {
  $("studentView").hidden = false;
  startStudent();
} else {
  $("teacherView").hidden = false;
  startTeacher();
}

/* ================= TEACHER LOGIC ================= */

function startTeacher() {
  $("genBtn").addEventListener("click", createQR);
  $("copyBtn").addEventListener("click", () => {
    navigator.clipboard.writeText($("copyBtn").dataset.url || "").then(() => {
      $("copyBtn").textContent = "Copied!";
      setTimeout(() => $("copyBtn").textContent = "Copy Student Link", 1500);
    });
  });
}

function extractSheetId(v) {
  const m = v.match(/\/d\/([a-zA-Z0-9-_]{20,})/);
  return m ? m[1] : v.trim();
}

async function createQR() {
  const btn = $("genBtn");
  const raw = $("sheetInput").value.trim();
  if (!raw) return alert("Please provide a sheet link.");

  const id = extractSheetId(raw);
  const sVal = $("startTime").value;
  const eVal = $("endTime").value;
  let start = 0, end = 0;

  if (sVal && eVal) {
    start = new Date(sVal).getTime();
    end = new Date(eVal).getTime();
    if (isNaN(start) || isNaN(end)) return alert("Invalid date/time input.");
    if (end <= start) return alert("Closing time must be after opening time.");
  } else if (sVal || eVal) {
    return alert("Specify both start and end time, or leave both empty.");
  }

  btn.disabled = true;
  btn.textContent = "Setting up session…";

  try {
    const url = `${APPS_SCRIPT_URL}?action=create&sheetId=${encodeURIComponent(id)}&start=${start}&end=${end}`;
    const r = await fetch(url, { redirect: "follow" });
    const res = await r.json();

    if (res.status === "error") throw new Error(res.message);

    let studentUrl = `${location.origin}${location.pathname}?sheetId=${encodeURIComponent(id)}`;
    let info = "Open session (no time expiration set).";
    if (res.mode === "timed") {
      info = `Opens: ${new Date(start).toLocaleString()}<br>Closes: ${new Date(end).toLocaleString()}`;
    }

    $("qrcode").innerHTML = "";
    new QRCode($("qrcode"), { text: studentUrl, width: 200, height: 200 });
    $("windowInfo").innerHTML = info;
    $("studentLink").textContent = studentUrl;
    $("copyBtn").dataset.url = studentUrl;
    $("qrbox").style.display = "block";
  } catch (err) {
    alert(err.message || "Failed to create QR session.");
  } finally {
    btn.disabled = false;
    btn.textContent = "Create QR Code";
  }
}

/* ================= STUDENT LOGIC ================= */

let fix = null;
let sessionOpen = false;

function getDeviceUuid() {
  let u = localStorage.getItem("att_device_uuid");
  if (!u) {
    u = (window.crypto && crypto.randomUUID) 
      ? crypto.randomUUID() 
      : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
          const r = Math.random() * 16 | 0;
          return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
        });
    localStorage.setItem("att_device_uuid", u);
  }
  return u;
}

function setPill(kind, text) {
  $("locPill").className = "pill " + kind;
  $("locText").textContent = text;
}

function updateSubmitState() {
  $("submitBtn").disabled = !(fix && sessionOpen);
}

function startLocation() {
  if (!navigator.geolocation) {
    setPill("bad", "Geolocation is not supported by your browser.");
    return;
  }

  setPill("wait", "Acquiring GPS location…");
  $("retryLoc").hidden = true;

  navigator.geolocation.getCurrentPosition(
    pos => {
      fix = {
        lat: pos.coords.latitude,
        lon: pos.coords.longitude,
        acc: pos.coords.accuracy
      };
      setPill("ok", "Location ready");
      updateSubmitState();
    },
    err => {
      setPill("bad", "Location access denied or unavailable. Enable GPS.");
      $("retryLoc").hidden = false;
      updateSubmitState();
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 }
  );
}

async function checkSession() {
  try {
    const res = await fetch(`${APPS_SCRIPT_URL}?action=session&sheetId=${encodeURIComponent(sheetId)}`, { redirect: "follow" });
    const data = await res.json();

    if (data.status === "open") {
      sessionOpen = true;
      $("sessionSub").textContent = "Session is active.";
    } else {
      sessionOpen = false;
      $("sessionSub").textContent = data.message || "Attendance session is closed.";
      $("form").hidden = true;
      showMsg(data.message || "Session closed.", "bad");
    }
  } catch (e) {
    sessionOpen = true;
    $("sessionSub").textContent = "Fill details and submit.";
  }
  updateSubmitState();
}

function showMsg(text, kind) {
  const m = $("msg");
  m.textContent = text;
  m.style.color = kind === "ok" ? "var(--ok)" : "var(--bad)";
}

function startStudent() {
  startLocation();
  checkSession();

  $("retryLoc").addEventListener("click", () => startLocation());

  $("form").addEventListener("submit", async e => {
    e.preventDefault();

    if (!fix) {
      showMsg("GPS fix required before submitting.", "bad");
      return;
    }

    const btn = $("submitBtn");
    const studentId = $("studentId").value.trim();
    const name = $("name").value.trim();
    const group = $("groupSelect").value;

    if (!studentId || name.length < 3 || !group) {
      showMsg("Please fill out all fields properly.", "bad");
      return;
    }

    btn.disabled = true;
    btn.textContent = "Recording…";
    showMsg("", "");

    try {
      const response = await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          sheetId: sheetId,
          studentId: studentId,
          name: name,
          group: group,
          latitude: fix.lat,
          longitude: fix.lon,
          accuracy: fix.acc,
          deviceUuid: getDeviceUuid()
        })
      });

      const res = await response.json();
      if (res.status === "success") {
        showMsg(res.message, "ok");
        $("form").hidden = true;
      } else {
        showMsg(res.message, "bad");
        if (!["duplicate", "duplicate_device", "expired", "not_started"].includes(res.status)) {
          btn.disabled = false;
        }
      }
    } catch (err) {
      showMsg("Network error during submission. Try again.", "bad");
      btn.disabled = false;
    } finally {
      btn.textContent = "Submit Attendance";
    }
  });
}
</script>
</body>
</html>
